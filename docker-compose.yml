# Local stack: Postgres, Redis, S3 storage (SeaweedFS), the API on :8100 and one worker.
#   docker compose up -d --build
#   open http://localhost:8100/docs
x-app: &app
  environment:
    DATABASE_URL: postgresql+psycopg://cva:cva@postgres:5432/cva
    REDIS_URL: redis://redis:6379/0
    API_KEYS: ${API_KEYS:-dev:dev-key}
    WEBHOOKS: ${WEBHOOKS:-}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    STORAGE: s3
    S3_URL: http://s3:8333
    S3_ACCESS_KEY: cv-analyzer
    S3_SECRET_KEY: cv-analyzer-dev
    S3_BUCKET: cv-analyzer
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    s3-setup:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cva
      POSTGRES_PASSWORD: cva
      POSTGRES_DB: cva
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cva"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7

  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-filer"]
    volumes:
      - s3data:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro

  s3-setup:
    image: chrislusf/seaweedfs:3.97
    depends_on: [s3]
    entrypoint:
      - sh
      - -c
      - |
        until echo 's3.bucket.list' | weed shell -master=s3:9333 2>/dev/null | grep -q cv-analyzer; do
          echo 's3.bucket.create -name cv-analyzer' | weed shell -master=s3:9333 >/dev/null 2>&1
          sleep 2
        done

  migrate:
    <<: *app
    build: { context: ., target: api }
    image: cv-analyzer/api:local
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *app
    image: cv-analyzer/api:local
    ports:
      - "8100:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    build: { context: ., target: worker }
    image: cv-analyzer/worker:local
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  s3data:

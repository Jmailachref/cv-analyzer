# Local stack: Postgres, Redis, S3 storage (SeaweedFS), the API on :8100 and one worker.
# The API creates the bucket on the first upload.
#   docker compose up -d --build
#   open http://localhost:8100 (the web app) or http://localhost:8100/docs (the API)
x-app: &app
  environment:
    DATABASE_URL: postgresql+psycopg://cva:cva@postgres:5432/cva
    REDIS_URL: redis://redis:6379/0
    API_KEYS: ${API_KEYS:-dev:dev-key}
    # The web app on http://localhost:8100 needs no key: requests without one act as "dev".
    OPEN_CLIENT: ${OPEN_CLIENT:-dev}
    WEBHOOKS: ${WEBHOOKS:-}
    WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    STORAGE: s3
    S3_URL: http://s3:8333
    S3_ACCESS_KEY: cv-analyzer
    S3_SECRET_KEY: cv-analyzer-dev
    S3_BUCKET: cv-analyzer
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started
    s3:
      condition: service_started

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cva
      POSTGRES_PASSWORD: cva
      POSTGRES_DB: cva
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cva"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7

  s3:
    image: chrislusf/seaweedfs:3.97
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-filer"]
    volumes:
      - s3data:/data
      - ./s3/s3.json:/etc/seaweedfs/s3.json:ro

  migrate:
    <<: *app
    build: { context: ., target: api }
    image: cv-analyzer/api:local
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *app
    build: { context: ., target: api }
    image: cv-analyzer/api:local
    ports:
      - "8100:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    build: { context: ., target: worker }
    image: cv-analyzer/worker:local
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  s3data:
